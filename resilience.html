<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>불성 탄력 계산기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f5f7fb;
      color: #222;
    }
    .wrap {
      max-width: 720px;
      margin: 40px auto;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }
    .desc {
      margin: 0 0 24px;
      color: #555;
      line-height: 1.6;
    }
    .input-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      min-width: 220px;
      padding: 14px 16px;
      font-size: 18px;
      border: 1px solid #cfd6e4;
      border-radius: 12px;
      outline: none;
    }
    input:focus {
      border-color: #4b89ff;
      box-shadow: 0 0 0 4px rgba(75,137,255,0.12);
    }
    button {
      padding: 14px 20px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #4b89ff;
      color: white;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.95;
    }
    .result {
      margin-top: 18px;
      display: grid;
      gap: 12px;
    }
    .item {
      background: #f8faff;
      border: 1px solid #e4ebf7;
      border-radius: 12px;
      padding: 16px;
    }
    .label {
      font-size: 14px;
      color: #666;
      margin-bottom: 6px;
    }
    .value {
      font-size: 26px;
      font-weight: bold;
    }
    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }
    .formula {
      margin-top: 18px;
      padding: 14px 16px;
      background: #fff8e8;
      border: 1px solid #f0dfac;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.7;
      color: #5b4b1d;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>불성 탄력 계산기</h1>
      <p class="desc">
        탄력 수치를 입력하면 불성(70레벨 기준)에서 적용되는 감소 수치를 계산합니다.
      </p>

      <div class="input-row">
        <input type="number" id="resilienceInput" placeholder="예: 233" min="0" step="1" />
        <button onclick="calculateResilience()">계산하기</button>
      </div>

      <div class="result">
        <div class="item">
          <div class="label">치명타 맞을 확률 감소</div>
          <div class="value" id="critChanceReduction">0%</div>
        </div>

        <div class="item">
          <div class="label">치명타 피해 감소</div>
          <div class="value" id="critDamageReduction">0%</div>
        </div>

        <div class="item">
          <div class="label">도트 피해 감소</div>
          <div class="value" id="dotReduction">0%</div>
        </div>

        <div class="item">
          <div class="label">마나 드레인/번 감소</div>
          <div class="value" id="manaReduction">0%</div>
        </div>
      </div>

      <div class="formula">
        기준 계산식<br />
        - 치명타 맞을 확률 감소 = 탄력 ÷ 39.4<br />
        - 치명타 피해 감소 = (탄력 ÷ 39.4) × 2<br />
        - 도트 피해 감소 = 탄력 ÷ 39.4<br />
        - 마나 드레인/번 감소 = 탄력 ÷ 39.4
      </div>

      <div class="note">
        예시: 탄력 233 → 치명타 맞을 확률 감소 약 5.91%, 치명타 피해 감소 약 11.83%
      </div>
    </div>
  </div>

  <script>
    function formatPercent(value) {
      return value.toFixed(2) + "%";
    }

    function calculateResilience() {
      const resilience = parseFloat(document.getElementById("resilienceInput").value) || 0;

      const baseReduction = resilience / 39.4;
      const critChanceReduction = baseReduction;
      const critDamageReduction = baseReduction * 2;
      const dotReduction = baseReduction;
      const manaReduction = baseReduction;

      document.getElementById("critChanceReduction").textContent = formatPercent(critChanceReduction);
      document.getElementById("critDamageReduction").textContent = formatPercent(critDamageReduction);
      document.getElementById("dotReduction").textContent = formatPercent(dotReduction);
      document.getElementById("manaReduction").textContent = formatPercent(manaReduction);
    }

    document.getElementById("resilienceInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        calculateResilience();
      }
    });
  </script>
</body>
</html>
